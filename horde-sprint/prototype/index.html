<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horde Sprint - Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            border: 2px solid #16213e;
            background: #0f3460;
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            text-align: center;
            pointer-events: none;
        }
        
        .stat {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Troops: <span id="troopCount">10</span></div>
        <div class="stat">Weapon: <span id="weaponType">Rifle</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script src="game.js"></script>
</body>
</html>
