<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horde Sprint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
        }

        canvas {
            display: block;
            background: #1a1a2e;
            border: 4px solid #00ff41;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .stat {
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
            border: 2px solid #00ff41;
        }

        #xpBarContainer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 25px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff41;
            border-radius: 12px;
            overflow: hidden;
        }

        #xpBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff41, #00cc33);
            transition: width 0.3s;
        }

        #instructions {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #00ff41;
        }

        #levelUpOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #levelUpOverlay h1 {
            color: #00ff41;
            font-size: 48px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px #00ff41;
        }

        #levelUpOptions {
            display: flex;
            gap: 20px;
        }

        .level-up-option {
            background: rgba(0, 255, 65, 0.1);
            border: 3px solid #00ff41;
            border-radius: 15px;
            padding: 30px;
            width: 220px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .level-up-option:hover {
            background: rgba(0, 255, 65, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ff41;
        }

        .level-up-option h3 {
            color: #00ff41;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .level-up-option p {
            color: white;
            font-size: 16px;
        }

        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            border: 3px solid #ff1744;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff1744;
            text-shadow: 0 0 20px #ff1744;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 15px;
        }

        button {
            background: #00ff41;
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px;
        }

        button:hover {
            background: #00cc33;
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ff41;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui">
            <div class="stat">Level: <span id="level">1</span></div>
            <div class="stat">Troops: <span id="troops">10</span></div>
            <div class="stat">Distance: <span id="distance">0/3000</span></div>
            <div class="stat">Score: <span id="score">0</span></div>
        </div>

        <div id="xpBarContainer">
            <div id="xpBar"></div>
        </div>

        <div id="instructions">
            WASD or Arrow Keys to Move | Space to Pause | Reach the Fortress!
        </div>

        <div id="levelUpOverlay">
            <h1>LEVEL UP!</h1>
            <div id="levelUpOptions"></div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Level Reached: <span id="finalLevel">1</span></p>
            <p>Final Score: <span id="finalScore">0</span></p>
            
            <button onclick="restartGame()">RESTART</button>
            <br>
            <button onclick="window.location.href='index.html'" style="background: #ff9100;">MAIN MENU</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
