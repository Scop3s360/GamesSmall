<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ship Hulls Preview</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0ff;
            padding: 20px;
        }
        h1 { color: #f0f; }
        .ship-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .ship-card {
            background: rgba(0,255,255,0.1);
            border: 2px solid #0ff;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        canvas {
            background: #111;
            border: 1px solid #0ff;
            image-rendering: pixelated;
            display: block;
            margin: 10px auto;
        }
        .label {
            color: #0f0;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .slots {
            color: #ff0;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🚀 Ship Hull Types (Empty - No Equipment)</h1>
    <p>5 different hull sizes with varying equipment slot counts</p>
    
    <div class="ship-container" id="ships"></div>

    <script>
        // Draw scout hull (2 slots)
        function drawScout(ctx) {
            ctx.fillStyle = '#0ff';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            
            // Compact nose
            ctx.beginPath();
            ctx.moveTo(32, 12);
            ctx.lineTo(26, 22);
            ctx.lineTo(38, 22);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Cockpit
            ctx.fillStyle = '#0f0';
            ctx.fillRect(30, 16, 4, 4);
            
            // Small body
            ctx.fillStyle = '#0ff';
            ctx.fillRect(28, 22, 8, 18);
            ctx.strokeRect(28, 22, 8, 18);
            
            // Single engine
            ctx.fillRect(29, 40, 6, 8);
            ctx.strokeRect(29, 40, 6, 8);
            ctx.fillStyle = '#f00';
            ctx.fillRect(30, 44, 4, 6);
            ctx.fillStyle = '#ff0';
            ctx.fillRect(31, 46, 2, 3);
        }

        // Draw fighter hull (4 slots)
        function drawFighter(ctx) {
            ctx.fillStyle = '#0ff';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            ctx.moveTo(32, 10);
            ctx.lineTo(24, 25);
            ctx.lineTo(40, 25);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#0f0';
            ctx.fillRect(29, 15, 6, 6);
            
            ctx.fillStyle = '#0ff';
            ctx.fillRect(22, 25, 20, 20);
            ctx.strokeRect(22, 25, 20, 20);
            
            ctx.fillRect(24, 45, 6, 8);
            ctx.fillRect(34, 45, 6, 8);
            ctx.strokeRect(24, 45, 6, 8);
            ctx.strokeRect(34, 45, 6, 8);
            
            ctx.fillStyle = '#f00';
            ctx.fillRect(25, 50, 4, 6);
            ctx.fillRect(35, 50, 4, 6);
            ctx.fillStyle = '#ff0';
            ctx.fillRect(26, 52, 2, 3);
            ctx.fillRect(36, 52, 2, 3);
        }

        // Draw corvette hull (6 slots)
        function drawCorvette(ctx) {
            ctx.fillStyle = '#0ff';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            
            // Wider nose
            ctx.beginPath();
            ctx.moveTo(32, 8);
            ctx.lineTo(20, 22);
            ctx.lineTo(44, 22);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Bridge
            ctx.fillStyle = '#0f0';
            ctx.fillRect(28, 14, 8, 6);
            ctx.strokeRect(28, 14, 8, 6);
            
            // Larger body
            ctx.fillStyle = '#0ff';
            ctx.fillRect(18, 22, 28, 24);
            ctx.strokeRect(18, 22, 28, 24);
            
            // Triple engines
            ctx.fillRect(20, 46, 6, 10);
            ctx.fillRect(29, 46, 6, 10);
            ctx.fillRect(38, 46, 6, 10);
            ctx.strokeRect(20, 46, 6, 10);
            ctx.strokeRect(29, 46, 6, 10);
            ctx.strokeRect(38, 46, 6, 10);
            
            ctx.fillStyle = '#f00';
            ctx.fillRect(21, 50, 4, 6);
            ctx.fillRect(30, 50, 4, 6);
            ctx.fillRect(39, 50, 4, 6);
        }

        // Draw destroyer hull (8 slots)
        function drawDestroyer(ctx) {
            ctx.fillStyle = '#0ff';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            
            // Command tower
            ctx.fillRect(28, 8, 8, 12);
            ctx.strokeRect(28, 8, 8, 12);
            
            // Bridge windows
            ctx.fillStyle = '#0f0';
            ctx.fillRect(30, 10, 4, 4);
            
            // Main hull
            ctx.fillStyle = '#0ff';
            ctx.fillRect(16, 20, 32, 28);
            ctx.strokeRect(16, 20, 32, 28);
            
            // Hull sections
            ctx.strokeRect(18, 24, 28, 8);
            ctx.strokeRect(18, 34, 28, 8);
            
            // Quad engines
            ctx.fillRect(18, 48, 6, 10);
            ctx.fillRect(26, 48, 6, 10);
            ctx.fillRect(32, 48, 6, 10);
            ctx.fillRect(40, 48, 6, 10);
            ctx.strokeRect(18, 48, 6, 10);
            ctx.strokeRect(26, 48, 6, 10);
            ctx.strokeRect(32, 48, 6, 10);
            ctx.strokeRect(40, 48, 6, 10);
            
            ctx.fillStyle = '#f00';
            ctx.fillRect(19, 52, 4, 6);
            ctx.fillRect(27, 52, 4, 6);
            ctx.fillRect(33, 52, 4, 6);
            ctx.fillRect(41, 52, 4, 6);
        }

        // Draw battleship hull (10 slots)
        function drawBattleship(ctx) {
            ctx.fillStyle = '#0ff';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            
            // Command superstructure
            ctx.fillRect(26, 6, 12, 14);
            ctx.strokeRect(26, 6, 12, 14);
            
            // Bridge
            ctx.fillStyle = '#0f0';
            ctx.fillRect(28, 8, 8, 6);
            ctx.strokeRect(28, 8, 8, 6);
            
            // Massive hull
            ctx.fillStyle = '#0ff';
            ctx.fillRect(12, 20, 40, 32);
            ctx.strokeRect(12, 20, 40, 32);
            
            // Armor sections
            ctx.strokeRect(14, 24, 36, 8);
            ctx.strokeRect(14, 34, 36, 8);
            ctx.strokeRect(14, 44, 36, 6);
            
            // Five engines
            ctx.fillRect(14, 52, 6, 8);
            ctx.fillRect(21, 52, 6, 8);
            ctx.fillRect(29, 52, 6, 8);
            ctx.fillRect(37, 52, 6, 8);
            ctx.fillRect(45, 52, 6, 8);
            
            ctx.fillStyle = '#f00';
            [15, 22, 30, 38, 46].forEach(x => {
                ctx.fillRect(x, 54, 4, 6);
            });
        }

        // Create ships
        const ships = [
            { name: 'Scout', slots: 2, draw: drawScout },
            { name: 'Fighter', slots: 4, draw: drawFighter },
            { name: 'Corvette', slots: 6, draw: drawCorvette },
            { name: 'Destroyer', slots: 8, draw: drawDestroyer },
            { name: 'Battleship', slots: 10, draw: drawBattleship }
        ];

        const container = document.getElementById('ships');
        
        ships.forEach(ship => {
            const card = document.createElement('div');
            card.className = 'ship-card';
            
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = ship.name + ' Hull';
            card.appendChild(label);
            
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ship.draw(ctx);
            card.appendChild(canvas);
            
            const slots = document.createElement('div');
            slots.className = 'slots';
            slots.textContent = ship.slots + ' Equipment Slots';
            card.appendChild(slots);
            
            container.appendChild(card);
        });
    </script>
</body>
</html>
