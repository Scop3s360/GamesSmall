<!DOCTYPE html>
<html>
<head>
    <title>Ship Test</title>
    <style>
        body { background: #000; color: #0ff; font-family: monospace; padding: 20px; }
        canvas { border: 1px solid #0ff; margin: 10px; background: #111; }
    </style>
</head>
<body>
    <h1>Ship Renderer Test</h1>
    <div id="test"></div>
    
    <script src="js/ship-renderer.js"></script>
    <script>
        console.log('ShipRenderer:', ShipRenderer);
        
        try {
            const testShip = {
                hullType: 'fighter',
                weapons: { laserTurrets: 1, missileLaunchers: 0, railguns: 0, plasmaCannons: 0 },
                defense: { shieldGenerators: 0, armorPlates: 0, pointDefense: 0 },
                hp: 100, maxHp: 100, shield: 0, maxShield: 0
            };
            
            const canvas = ShipRenderer.createShipCanvas('player', testShip);
            document.getElementById('test').appendChild(canvas);
            console.log('Canvas created successfully');
        } catch(e) {
            console.error('Error:', e);
            document.getElementById('test').innerHTML = '<p style="color: red;">Error: ' + e.message + '</p>';
        }
    </script>
</body>
</html>
